<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151a17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Eltern-Cockpit</title>
<style>
:root{
  --bg:#f5f2ea;--card:#fffdf8;--ink:#1d2621;--muted:#68706a;--line:#e3ddd0;--soft:#efeadf;
  --court:#2f6f4e;--court-soft:#dcebe1;
  --m:#3567a8;--e:#c0603a;--d:#3f7d4f;--r:#7a58a8;--b:#1f7f86;--w:#b0782a;
  --warn:#b4552f;--warn-soft:#f6e4da;--good:#2f6f4e;
  --r1:#e9e3d6;--r2:#c9c1b0;
  --tab:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#151a17;--card:#1d2420;--ink:#e9ece7;--muted:#9aa29c;--line:#2e3732;--soft:#252d28;
  --court:#6dba8e;--court-soft:#21382b;
  --m:#7ea6e0;--e:#e48d68;--d:#7fbf8d;--r:#b296de;--b:#5fc0c6;--w:#d9a95c;
  --warn:#e8916b;--warn-soft:#3a2720;--good:#6dba8e;--r1:#2a322d;--r2:#45504a;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 24px)}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-size:1.55rem;letter-spacing:-.01em}
h2{font-size:1.08rem}
h3{font-size:.98rem}
p{margin:0}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{padding:calc(env(safe-area-inset-top) + 18px) 0 10px}
.top .row1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.kicker{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.tiny{font-size:.76rem}
.stack>*+*{margin-top:12px}
.stack-s>*+*{margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card+.card,.sec+.sec{margin-top:14px}
.sec{margin-top:22px}
.sec>h2{margin:0 0 10px 2px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;min-width:0}
.tile .lbl{font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tile .big{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.tile .sub{font-size:.76rem;color:var(--muted)}
.delta{font-size:.78rem;font-weight:600}
.delta.up{color:var(--good)}.delta.down{color:var(--warn)}.delta.eq{color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:10px}
.days .d{aspect-ratio:1;border-radius:6px;background:var(--r1);display:flex;align-items:center;justify-content:center;font-size:.62rem;color:var(--muted)}
.days .d.on{background:var(--court);color:#fff}
.days .d.slam{box-shadow:inset 0 0 0 2px #e2b23c}
.days .d.today{outline:2px solid var(--ink);outline-offset:1px}
.dl{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:3px}
.dl span{font-size:.6rem;text-align:center;color:var(--muted)}
.hint{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.hint:first-of-type{border-top:0;padding-top:2px}
.hint .ic{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.hint.look .ic{background:var(--warn-soft)}
.hint.good .ic{background:var(--court-soft)}
.skill{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.skill:first-child{border-top:0}
.skill .nm{font-weight:600;font-size:.92rem;min-width:0}
.skill .meta{font-size:.78rem;color:var(--muted);grid-column:1/-1;display:flex;gap:10px;align-items:center}
.bar{height:7px;border-radius:4px;background:var(--r1);overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;border-radius:4px}
.lv{display:flex;gap:3px;align-items:center}
.lv i{width:16px;height:8px;border-radius:3px;background:var(--r1)}
.lv i.on{background:var(--m)}
.stackbar{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--r1);margin:8px 0 6px}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:10px;height:10px;border-radius:3px;display:inline-block}
.pill{display:inline-block;font-size:.74rem;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:600;white-space:nowrap}
.pill.ok{background:var(--court-soft);color:var(--good)}
.pill.no{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tab)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.74rem;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--court)}
.text{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-size:1rem;line-height:1.55}
.diff del{color:var(--warn);text-decoration:line-through;text-decoration-thickness:1.5px}
.diff ins{color:var(--good);text-decoration:none;font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
table.t th{text-align:right;font-weight:600;color:var(--muted);font-size:.74rem;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
.tscroll{overflow-x:auto;margin:0 -4px}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{list-style:none;cursor:pointer;padding:11px 0;display:flex;align-items:center;gap:10px;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary .chev{transition:transform .15s;color:var(--muted);flex:none}
details[open]>summary .chev{transform:rotate(90deg)}
.item{padding:8px 0;border-top:1px dashed var(--line);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.item:first-child{border-top:0}
.item .q{min-width:0;flex:1}
.ans{color:var(--good);font-weight:600}
.opt{display:inline-block;margin:3px 6px 0 0;font-size:.82rem;padding:1px 7px;border-radius:6px;background:var(--soft);color:var(--muted)}
.opt.right{background:var(--court-soft);color:var(--good);font-weight:600}
.pips{display:flex;gap:2px;flex:none;padding-top:5px}
.pips i{width:7px;height:7px;border-radius:2px;background:var(--r1)}
.pips i.on{background:var(--e)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart text{fill:var(--muted);font-size:9.5px;font-family:inherit}
.chart .grid{stroke:var(--line);stroke-width:1}
.note{font-size:.8rem;color:var(--muted);margin-top:8px}
.login{max-width:420px;margin:12vh auto 0}
.inp{width:100%;font:inherit;font-size:1rem;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 16px;background:var(--court);color:#fff;font-weight:700;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);width:auto;padding:8px 12px;font-weight:600;font-size:.88rem}
.err{color:var(--warn);font-size:.88rem}
.empty{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:.9rem}
.lvltab{width:100%;border-collapse:collapse;font-size:.84rem;margin-top:6px}
.lvltab td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.lvltab td:first-child{width:62px;color:var(--muted);font-weight:600;white-space:nowrap}
.lvltab tr.cur td{background:var(--court-soft)}
.lvltab tr.cur td:first-child{color:var(--good)}
.ex{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;color:var(--muted)}
.mark{background:color-mix(in srgb,#e2b23c 30%,transparent);border-radius:3px;padding:0 2px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--court);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:420px){.grid3{gap:8px}.tile{padding:10px 9px}.tile .big{font-size:1.35rem}}
</style>
</head>
<body>
<div id="app" class="wrap"><p class="muted" style="margin-top:30vh;text-align:center"><span class="spin"></span></p></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-tab="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Überblick</button>
  <button data-tab="aufgaben"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h6M8 11h6"/></svg>Aufgaben</button>
  <button data-tab="entwicklung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 16l4-5 4 3 6-8"/></svg>Entwicklung</button>
</div></nav>

<script src="familie-sync.js"></script>
<script>
/* Eltern-Cockpit – Lernstände, Aufgaben und Entwicklung aus dem Familienspeicher.
   Liest die Inhalte direkt aus den Apps (../lern-match/inhalte.js usw.), damit immer der aktuelle Stoff zu sehen ist. */
(function(){
"use strict";
const FS=window.FamilieSync;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d);};
const dLabel=(s,o)=>new Date(s+"T12:00:00").toLocaleDateString("de-DE",o||{day:"numeric",month:"numeric"});
const wd=s=>["So","Mo","Di","Mi","Do","Fr","Sa"][new Date(s+"T12:00:00").getDay()];
const pct=(ok,n)=>n?Math.round(ok/n*100):null;
const mondayOf=s=>{const d=new Date(s+"T12:00:00");const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d);};
const COL={m:"var(--m)",e:"var(--e)",d:"var(--d)",r:"var(--r)",b:"var(--b)",w:"var(--w)"};
const SUBJ={m:"Mathe",e:"Englisch",d:"Deutsch"};
const CHEV='<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';

/* ---------- Inhalte der Apps laden ---------- */
const BASE="../";
function loadScript(src){return new Promise(res=>{const s=document.createElement("script");s.src=src+"?v="+Date.now();s.onload=()=>res(true);s.onerror=()=>res(false);document.head.appendChild(s);});}
const C={lm:null,faelle:[],tests:[],testData:{}};
async function loadContent(){
  await Promise.all([loadScript(BASE+"lern-match/inhalte.js"),loadScript(BASE+"spuernase/inhalte.js"),loadScript(BASE+"testtrainer/tests.js")]);
  C.lm=window.INHALTE||null;C.faelle=window.FAELLE||[];C.tests=window.TESTS||[];
  for(const t of C.tests){
    ["STATIONEN","GENERALPROBE","MERKSAETZE","SKELETT","ZAEHNE","POSEN","TESTTAG"].forEach(k=>{try{delete window[k];}catch(e){window[k]=undefined;}});
    const ok=await loadScript(BASE+"testtrainer/"+t.ordner+"/inhalte.js");
    if(ok)C.testData[t.ordner]={stationen:window.STATIONEN||[],skelett:window.SKELETT||{},merk:window.MERKSAETZE||null};
  }
  buildIndex();
}
/* Gleiche Kennungen wie in Lern-Match */
const IDX={words:[],eg:[],de:[]};
const DE_CAT={s:"s, ss oder ß",i:"i oder ie",doppel:"Doppelte Mitlaute",ck:"k oder ck",tz:"z oder tz",gross:"Groß und klein",wortart:"Wortarten",fehler:"Fehlerwörter",zeitform:"Zeitformen",steigerung:"Steigern und vergleichen",satzglied:"Subjekt und Prädikat",satzzeichen:"Satzzeichen",rede:"Wörtliche Rede",pronomen:"Pronomen"};
const TB_CAT={gross:"Groß und klein",doppel:"Doppelte Mitlaute",s:"s, ss oder ß",i:"i oder ie",ae:"e oder ä",ck:"k oder ck",tz:"z oder tz",dehnung:"Dehnungs-h",auslaut:"d/t oder g/k am Wortende",dass:"das oder dass",getrennt:"Zusammen oder getrennt",sonst:"Sonstiges"};
const TB_HOW={selbst:"selbst gefunden",tipp:"mit Tipp",tipp2:"mit 2 Tipps",geloest:"Lösung gezeigt"};
function buildIndex(){
  const I=C.lm||{};
  (I.englisch||[]).forEach((u,ui)=>u.woerter.forEach((w,wi)=>IDX.words.push({id:"u"+ui+"-"+wi,u:ui,unit:u.unit,de:w[0],en:w[1],note:w[2]||""})));
  IDX.eg=(I.englischGrammatik||[]).map(x=>({id:"g-"+x[0],s:x[0],o:x[1],a:x[2],tip:x[3]||""}));
  const D=I.deutsch||{},gap=(cat,w,a,o)=>IDX.de.push({id:cat+"-"+w,cat,q:w,o,a,show:w.replace(a,"<b>"+esc(a)+"</b>")});
  (D.s||[]).forEach(([w,a])=>gap("s",w,a,["s","ss","ß"]));
  (D.i||[]).forEach(([w,a])=>gap("i",w,a,["i","ie"]));
  (D.doppel||[]).forEach(([w,a])=>{const dbl=a.length===2&&a[0]===a[1];gap("doppel",w,a,dbl?[a[0],a]:[a,a+a]);});
  (D.ck||[]).forEach(([w,a])=>gap("ck",w,a,["k","ck"]));
  (D.tz||[]).forEach(([w,a])=>gap("tz",w,a,["z","tz"]));
  (D.gross||[]).forEach(([s,a,o])=>IDX.de.push({id:"gross-"+s,cat:"gross",q:s,a,show:esc(s)+' → <b>'+esc(a.charAt(0).toUpperCase()+a.slice(1))+'</b> groß'}));
  (D.wortart||[]).forEach(([w,a])=>IDX.de.push({id:"wa-"+w,cat:"wortart",q:w,a,show:esc(w)+" → <b>"+esc(a)+"</b>"}));
  (D.fehler||[]).forEach(([o,a,c])=>IDX.de.push({id:"fe-"+a,cat:"fehler",q:o.join(" · "),a,show:esc(o.join(" · "))+" → falsch: <s>"+esc(a)+"</s>, richtig: <b>"+esc(c)+"</b>"}));
  (D.extra||[]).forEach(([cat,q,o,a,tip])=>IDX.de.push({id:"x-"+cat+"-"+q+"-"+o[a],cat,q,o,a,tip,show:esc(q)+" → <b>"+esc(o[a])+"</b>"}));
}

/* ---------- Mathe: was jede Stufe verlangt (aus den Aufgaben-Generatoren in Lern-Match) ---------- */
const SKILLS={plus:"Plus im Kopf",minus:"Minus im Kopf",mal:"Mal rechnen",geteilt:"Geteilt rechnen",begriffe:"Fachbegriffe",ueberschlag:"Überschlagen",luecke:"Fehlende Zahl",mauer:"Zahlenmauer",probe:"Probe",schriftlich:"Schriftlich rechnen",text:"Textaufgaben",worte:"Aufgaben mit Worten",geschickt:"Geschickt rechnen",klammer:"Klammern und Punkt vor Strich",groessen:"Größen umrechnen",zeit:"Zeitspannen",schriftmal:"Schriftlich malnehmen",gtext:"Sachaufgaben mit Größen"};
const BASIS=["plus","minus","mal","geteilt","begriffe","ueberschlag","luecke","mauer","probe","schriftlich","text"];
const KAP={2:{n:"Kapitel 2: Addieren und Subtrahieren",s:["worte","geschickt","klammer","schriftlich","ueberschlag","luecke","text"]},3:{n:"Kapitel 3: Mit Größen rechnen",s:["groessen","zeit","gtext"]},5:{n:"Kapitel 5: Multiplizieren und Dividieren",s:["worte","klammer","schriftmal","mal","geteilt","text"]}};
const LEVELS={
  plus:[["Zweistellig plus einstellig","47 + 6"],["Zweistellig plus zweistellig","58 + 37"],["Dreistellig plus zweistellig","436 + 78"]],
  minus:[["Zweistellig minus einstellig","63 − 7"],["Zweistellig minus zweistellig","82 − 37"],["Von 100 oder Dreistelligem zweistellig abziehen","523 − 68"]],
  mal:[["Einmaleins mit 2, 3, 4, 5 und 10","4 · 7"],["Ganzes kleines Einmaleins","7 · 8"],["11 bis 19 mal einstellig, oder mal 10 und mal 100","14 · 6 · 37 · 100"]],
  geteilt:[["Umkehrung der 2er-, 3er-, 4er-, 5er- und 10er-Reihe","35 : 5"],["Umkehrung des kleinen Einmaleins","56 : 8"],["Ergebnis zwischen 11 und 20","84 : 6"]],
  begriffe:[["Summand, Summe, Minuend, Subtrahend, Differenz","58 + 23 = 81 → Wie heißt 23?"],["Zusätzlich Faktor, Produkt, Dividend, Divisor, Quotient","42 : 6 = 7 → Wie heißt 6?"],["Wie Stufe 2","—"]],
  ueberschlag:[["Zwei Zweistellige auf Zehner runden und addieren","47 + 68 ≈ 50 + 70"],["Dreistellig plus oder minus zweistellig","318 + 46 ≈ 320 + 50"],["Dreistellig plus oder minus dreistellig","734 − 289 ≈ 730 − 290"]],
  luecke:[["Lücke bei Plus und Minus","35 + ? = 52"],["Auch bei Mal und Geteilt","6 · ? = 42"],["Wie Stufe 2","? : 7 = 8"]],
  mauer:[["3 Steine unten, Zahlen bis 20","Spitze der Mauer finden"],["3 Steine unten, Zahlen bis 50","—"],["4 Steine unten, Zahlen bis 15","vier Reihen hoch"]],
  probe:[["Zweistellige Minusaufgabe mit der Umkehraufgabe prüfen","84 − 27 = 57?"],["Dreistellige Minusaufgabe prüfen","563 − 78 = 485?"],["Wie Stufe 2","—"]],
  schriftlich:[["Dreistellig plus dreistellig","437 + 268"],["Vierstellig plus, oder dreistellig minus","3482 + 1796 · 812 − 347"],["Vierstellig plus und minus","7215 − 3468"]],
  text:[["Ein Rechenschritt, kleine Zahlen (Wechselgeld, Bälle verteilen)","Griffband 7 € + Flasche 9 €, bezahlt mit 20 €"],["Größere Zahlen, auch Mal (Match-Dauer, Spardose)","Satz 1: 34 Min., Satz 2: 41 Min."],["Auch zwei Rechenschritte","5 Dosen zu je 4 € von 37 € Erspartem"]],
  worte:[["„Summe“, „Differenz“, „vermindere“ … bis 100","Bilde die Differenz von 84 und 29."],["Zahlen bis 500","Subtrahiere 178 von 452."],["Zahlen bis 1000, ab Kapitel 5 auch Produkt und Quotient","Dividiere 96 durch 8."]],
  geschickt:[["Zehner bilden durch Vertauschen","7 + 26 + 3"],["Hunderter bilden","38 + 54 + 62"],["Vier Zahlen, Hunderter bilden","38 + 54 + 62 + 17"]],
  klammer:[["Klammer zuerst, Zahlen bis etwa 60","45 − (18 − 6)"],["Zahlen bis etwa 150","132 − (27 + 18)"],["Zahlen bis etwa 400; ab Kapitel 5 auch Punkt vor Strich","7 + 4 · 6"]],
  groessen:[["Einfach umrechnen: € und ct, m und cm, km und m, kg und g, h und min","3 m = ? cm"],["Gemischte Angaben, auch t und mm","4 m 25 cm = ? cm"],["Kommazahlen","3,45 m = ? cm"]],
  zeit:[["Zeitspanne bis 45 Minuten","14:20 bis 14:55 Uhr"],["Zeitspanne bis knapp 2 Stunden","9:35 bis 10:50 Uhr"],["Zeitspanne von 70 bis 200 Minuten","15:10 bis 17:45 Uhr"]],
  schriftmal:[["Dreistellig mal einstellig","318 · 7"],["Vierstellig mal einstellig","2346 · 6"],["Zweistellig mal zweistellig","47 · 23"]],

function histSum(h,from,to){const r={m:[0,0],e:[0,0],d:[0,0]};if(!h)return r;Object.keys(h).forEach(k=>{if(k>=from&&k<=to)["m","e","d"].forEach(s=>{const v=h[k][s];if(v){r[s][0]+=v[0];r[s][1]+=v[1];}});});return r;}
function trainDays(){
  const set={},add=(o,src)=>Object.keys(o||{}).forEach(k=>{(set[k]=set[k]||[]).push(src);});
  const lm=LM(),sn=SN();
  if(lm)add(lm.days,"lm");if(sn){add(sn.days,"sn");add(sn.log,"sn");}

}
function streak(days){let d=today();if(!days[d])d=addDays(d,-1);let n=0;while(days[d]){n++;d=addDays(d,-1);}return n;}
const vocabState=id=>((LM()||{}).en||{})[id];

function hints(){

  const weakM=Object.keys(m).filter(k=>m[k].n>=5&&m[k].ok/m[k].n<.5).sort((a,b)=>m[a].ok/m[a].n-m[b].ok/m[b].n);
  if(weakM.length)H.push({t:"look",ic:"🔍",h:`Mathe: ${weakM.length===1?"ein Bereich":weakM.length+" Bereiche"} unter 50 %`,p:weakM.map(k=>{const s=m[k];return `<b>${esc(SKILLS[k]||k)}</b>: ${s.ok} von ${s.n} richtig, Stufe ${s.lvl}${s.run<=-2?' <span style="color:var(--warn)">· zuletzt '+(-s.run)+'× falsch in Folge</span>':s.run>=2?' <span style="color:var(--good)">· zuletzt '+s.run+'× richtig in Folge</span>':""}`;}).join("<br>")+"<br>Vielleicht einmal gemeinsam eine Aufgabe rechnen.",go:"mathe"});
  const hard=IDX.words.filter(w=>{const s=vocabState(w.id);return s&&(s.miss||0)>=3;}).sort((a,b)=>vocabState(b.id).miss-vocabState(a.id).miss);
  if(hard.length)H.push({t:"look",ic:"🔤",h:`${hard.length===1?"Ein Englischwort hakt":hard.length+" Englischwörter haken"}`,p:hard.slice(0,6).map(w=>`<b>${esc(w.en[0])}</b> (${esc(w.de)})`).join(", "),go:"englisch"});
  const de=lm.de||{};const weakDe=IDX.de.filter(d=>{const s=de[d.id];return s&&s.n>=3&&s.ok/s.n<.5;});
  if(weakDe.length)H.push({t:"look",ic:"✏️",h:"Deutsch: mehrfach daneben",p:weakDe.sort((a,b)=>(de[a.id].last===false?0:1)-(de[b.id].last===false?0:1)).slice(0,5).map(d=>{const q=d.q.length>40?d.q.slice(0,40)+"…":d.q,qq=/^[„"]/.test(q)?esc(q):"„"+esc(q)+"“";return `${esc(DE_CAT[d.cat]||d.cat)}: ${qq} (${de[d.id].ok} von ${de[d.id].n})${de[d.id].last===false?' <span style="color:var(--warn)">· zuletzt falsch</span>':' <span style="color:var(--good)">· zuletzt richtig</span>'}`;}).join("<br>"),go:"deutsch"});
  const egW=IDX.eg.filter(g=>((lm.eg||{})[g.id]||{}).last===false);
  if(egW.length>=3)H.push({t:"look",ic:"🇬🇧",h:`Grammatik: ${egW.length} Sätze zuletzt falsch`,p:egW.slice(0,3).map(g=>"„"+esc(g.s)+"“").join(", "),go:"grammatik"});

  if(top.length)H.push({t:"good",ic:"⭐",h:`Mathe auf höchster Stufe: ${top.length} ${top.length===1?"Bereich":"Bereiche"}`,p:top.map(k=>SKILLS[k]).join(", ")});
  const sicher=vocabBuckets(lm.en).sicher;if(sicher)H.push({t:"good",ic:"🧠",h:`${sicher} Vokabeln sitzen fest`,p:"Box 4 oder 5 – sie kommen nur noch selten zur Wiederholung."});
  return H;
}

/* ---------- Diagramme (SVG, ohne Bibliothek) ---------- */
function nice(v){const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function lineChart(o){
  const W=380,H=o.h||170,L=40,R=o.right||78,T=10,B=22,n=o.x.length;if(!n)return"";
  const ymax=o.ymax!=null?o.ymax:nice(Math.max(1,...o.series.flatMap(s=>s.v.filter(v=>v!=null)))),ymin=o.ymin||0;
  const X=i=>L+(n===1?(W-L-R)/2:i*(W-L-R)/(n-1)),Y=v=>T+(H-T-B)*(1-(v-ymin)/(ymax-ymin));
  const ticks=o.ticks||[ymin,(ymin+ymax)/2,ymax].map(v=>Math.round(v));
  let g=ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-6}" y="${Y(t)+3}" text-anchor="end">${t}${o.unit||""}</text>`).join("");
  const step=Math.max(1,Math.ceil(n/5));
  g+=o.x.map((x,i)=>i%step===0||i===n-1?`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(x)}</text>`:"").join("");
  const labels=[];
  o.series.forEach(s=>{
    let d="",pen=false;s.v.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);pen=true;});
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.v.forEach((v,i)=>{if(v!=null&&(o.dots||s.v.filter(x=>x!=null).length<12))g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="${s.c}"><title>${esc(o.x[i])}: ${v}${o.unit||""}</title></circle>`;});
    let li=-1;s.v.forEach((v,i)=>{if(v!=null)li=i;});if(li>=0)labels.push({y:Y(s.v[li]),x:X(li),c:s.c,t:s.name+" "+s.v[li]+(o.unit||"")});
  });
  labels.sort((a,b)=>a.y-b.y);for(let i=1;i<labels.length;i++)if(labels[i].y-labels[i-1].y<12)labels[i].y=labels[i-1].y+12;
  g+=labels.map(l=>`<text x="${W-R+6}" y="${l.y+3}" style="fill:${l.c};font-weight:700">${esc(l.t)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||"")}">${g}</svg>`;
}
function barChart(o){
  const W=380,H=o.h||150,L=30,R=6,T=10,B=22,n=o.x.length;if(!n)return"";
  const tot=o.x.map((_,i)=>o.series.reduce((a,s)=>a+(s.v[i]||0),0)),ymax=nice(Math.max(1,...tot));
  const bw=(W-L-R)/n,Y=v=>T+(H-T-B)*(1-v/ymax);
  let g=[0,ymax/2,ymax].map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-6}" y="${Y(t)+3}" text-anchor="end">${Math.round(t)}</text>`).join("");
  const step=Math.max(1,Math.ceil(n/5));
  o.x.forEach((x,i)=>{let base=0;const cx=L+i*bw;
    o.series.forEach(s=>{const v=s.v[i]||0;if(v){g+=`<rect x="${(cx+bw*.18).toFixed(1)}" width="${(bw*.64).toFixed(1)}" y="${Y(base+v).toFixed(1)}" height="${(Y(base)-Y(base+v)).toFixed(1)}" fill="${s.c}" rx="1.5"><title>${esc(x)} · ${esc(s.name)}: ${v}</title></rect>`;base+=v;}});
    if(i%step===0||i===n-1)g+=`<text x="${cx+bw/2}" y="${H-8}" text-anchor="middle">${esc(x)}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||"")}">${g}</svg>`;
}

   </div></div>`;

function secMathe(lm){

function secDeutsch(lm){

function wordDiff(a,b){
  const A=a.split(/\s+/).filter(Boolean),B=b.split(/\s+/).filter(Boolean),n=A.length,m=B.length,D=[];
  for(let i=0;i<=n;i++){D[i]=new Array(m+1).fill(0);}
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=A[i]===B[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
  let i=0,j=0,o=[];while(i<n&&j<m){if(A[i]===B[j]){o.push(esc(A[i]));i++;j++;}else if(D[i+1][j]>=D[i][j+1]){o.push("<del>"+esc(A[i])+"</del>");i++;}else{o.push("<ins>"+esc(B[j])+"</ins>");j++;}}
  while(i<n)o.push("<del>"+esc(A[i++])+"</del>");while(j<m)o.push("<ins>"+esc(B[j++])+"</ins>");return o.join(" ");
}

/* ---------- Ansicht: Entwicklung ---------- */
function vEntwicklung(){
  const lm=LM(),t=today();
  const ranges=[[14,"2 Wochen"],[28,"4 Wochen"],[91,"3 Monate"],[0,"Alles"]];
  let start=S.range?addDays(t,-S.range+1):null;
  const allDays=[...Object.keys((lm&&lm.hist)||{}),...S.daily.map(d=>d.day),...S.log.map(e=>e.occurred_at.slice(0,10))].sort();
  if(!start||(allDays[0]&&allDays[0]>start))start=allDays[0]||addDays(t,-13);
  const X=[];for(let d=start;d<=t;d=addDays(d,1))X.push(d);
  const XL=X.map(d=>dLabel(d));
  let h=`<div class="chips" style="margin-top:6px">${ranges.map(([n,l])=>`<button class="chip ${S.range===n?"on":""}" data-range="${n}">${l}</button>`).join("")}</div>`;
  if(lm){
    const H=lm.hist||{};
    const roll=k=>X.map(d=>{const s=histSum(H,addDays(d,-6),d)[k];return s[1]>=6?pct(s[0],s[1]):null;});
    h+=`<div class="sec"><h2>Trefferquote</h2><div class="card"><p class="small muted">Anteil richtiger Antworten, gleitend über 7 Tage.</p>
      ${lineChart({x:XL,ymin:0,ymax:100,ticks:[0,50,100],unit:" %",series:["m","e","d"].map(k=>({name:SUBJ[k],c:COL[k],v:roll(k)})),label:"Trefferquote je Fach"})}</div></div>`;
    h+=`<div class="sec"><h2>Übungsmenge</h2><div class="card"><p class="small muted">Beantwortete Aufgaben pro Tag in Lern-Match.</p>
      ${barChart({x:XL,series:["m","e","d"].map(k=>({name:SUBJ[k],c:COL[k],v:X.map(d=>(H[d]&&H[d][k])?H[d][k][1]:0)})),label:"Aufgaben pro Tag"})}${legend(["m","e","d"].map(k=>[SUBJ[k],COL[k]]))}</div></div>`;
    /* Vokabeln: angefangen (exakt aus dem ersten Übungstag) und sicher (aus den Tagesständen) */
    const en=lm.en||{},firsts=Object.values(en).map(s=>s.first).filter(Boolean);
    const started=X.map(d=>firsts.filter(f=>f<=d).length);
    const snapLM=S.daily.filter(r=>r.app==="lern-match");const snapBy={};snapLM.forEach(r=>snapBy[r.day]=r);
    const secure=X.map(d=>{const r=snapBy[d];if(!r||!r.en)return null;return Object.values(r.en).filter(s=>(s.box||0)>=4).length;});
    if(!secure[secure.length-1]&&lm.en)secure[secure.length-1]=Object.values(lm.en).filter(s=>(s.box||0)>=4).length;
    h+=`<div class="sec"><h2>Englisch-Wortschatz</h2><div class="card">${lineChart({x:XL,series:[{name:"Begonnen",c:"color-mix(in srgb,var(--e) 45%,transparent)",v:started},{name:"Sicher",c:"var(--e)",v:secure}],label:"Vokabeln"})}
      <p class="note">„Begonnen“ reicht zurück bis zum ersten Üben. „Sicher“ (Box 4–5) wird erst seit dem 7.11. täglich festgehalten – der Verlauf füllt sich ab jetzt Tag für Tag.</p></div></div>`;
    /* Mathe-Stufen */
    const lvl=X.map(d=>{const r=snapBy[d];const mm=r&&r.m;if(!mm)return null;const ks=Object.keys(mm).filter(k=>mm[k].n);return ks.length?Math.round(ks.reduce((a,k)=>a+mm[k].lvl,0)/ks.length*10)/10:null;});
    if(lvl[lvl.length-1]==null&&lm.m){const ks=Object.keys(lm.m).filter(k=>lm.m[k].n);if(ks.length)lvl[lvl.length-1]=Math.round(ks.reduce((a,k)=>a+lm.m[k].lvl,0)/ks.length*10)/10;}
    h+=`<div class="sec"><h2>Mathe-Stufen</h2><div class="card">${lineChart({x:XL,ymin:1,ymax:3,ticks:[1,2,3],dots:true,series:[{name:"Ø Stufe",c:"var(--m)",v:lvl}],label:"Durchschnittliche Mathe-Stufe"})}
      <p class="note">Durchschnitt über alle geübten Rechenbereiche (1 bis 3). Wird seit dem 7.11. täglich festgehalten.</p></div></div>`;
  }
  /* Lesen */
  const rv=readEvents();
  if(rv.length){const pts=rv.filter(e=>e.value.wpm);
    h+=`<div class="sec"><h2>Lesetempo</h2><div class="card">${pts.length?lineChart({x:pts.map(e=>dLabel(e.occurred_at.slice(0,10))),dots:true,series:[{name:"Tempo",c:"var(--r)",v:pts.map(e=>e.value.wpm)}],label:"Lesetempo je Kapitel"}):""}
      <p class="note">Ein Punkt pro gelesenem Kapitel. Spätere Fälle haben längere Texte – ein leichter Rückgang beim Tempo ist dann normal.</p></div></div>`;}
  /* Schreiben */
  const tbe=S.log.filter(e=>e.app==="lern-match"&&e.kind==="tiebreak").slice().reverse();
  if(tbe.length){
    h+=`<div class="sec"><h2>Schreiben</h2><div class="card">
      ${lineChart({x:tbe.map(e=>dLabel(e.occurred_at.slice(0,10))),dots:true,series:[{name:"Wörter",c:"var(--w)",v:tbe.map(e=>e.value.woerter||0)},{name:"Fehler",c:"var(--warn)",v:tbe.map(e=>e.value.fehler||0)}],label:"Tie-Break"})}
      <p class="note">Ein Punkt pro Tie-Break. Gutes Zeichen: mehr Wörter bei gleich vielen oder weniger Fehlern – und mehr selbst gefundene Fehler.</p></div></div>`;}
  /* Wochentabelle */
  if(lm){const H=lm.hist||{},days=trainDays(),wk={};
    Object.keys(days).concat(Object.keys(H)).forEach(d=>{if(d<start)return;const w=mondayOf(d);wk[w]=wk[w]||{days:new Set(),n:0,s:{m:[0,0],e:[0,0],d:[0,0]},slams:0};if(days[d])wk[w].days.add(d);});
    Object.keys(H).forEach(d=>{const w=mondayOf(d);if(!wk[w])return;["m","e","d"].forEach(k=>{const v=H[d][k];if(v){wk[w].s[k][0]+=v[0];wk[w].s[k][1]+=v[1];wk[w].n+=v[1];}});});
    Object.keys(lm.slams||{}).forEach(d=>{const w=mondayOf(d);if(wk[w])wk[w].slams++;});
    const rows=Object.keys(wk).sort().reverse();const cell=s=>s[1]?pct(s[0],s[1])+" %":"–";
    h+=`<div class="sec"><h2>Wochen im Vergleich</h2><div class="card tscroll"><table class="t"><thead><tr><th>Woche ab</th><th>Tage</th><th>Aufgaben</th><th>Mathe</th><th>Englisch</th><th>Deutsch</th><th>Slams</th></tr></thead><tbody>
      ${rows.map(w=>`<tr><td>${dLabel(w,{day:"numeric",month:"short"})}</td><td>${wk[w].days.size}</td><td>${wk[w].n}</td><td>${cell(wk[w].s.m)}</td><td>${cell(wk[w].s.e)}</td><td>${cell(wk[w].s.d)}</td><td>${wk[w].slams||""}</td></tr>`).join("")}</tbody></table></div></div>`;}
  return h;
}

  const app=$("#app"),tabs=$("#tabs");
  if(!FS.session()){tabs.hidden=true;app.innerHTML=vLogin();return;}
  if(S.err&&!S.kid){tabs.hidden=true;app.innerHTML=`<div class="login card stack"><h2>Eltern-Cockpit</h2><p class="err">${esc(S.err)}</p><button class="btn" data-act="reload">Nochmal versuchen</button><button class="btn ghost" data-act="out">Abmelden</button></div>`;return;}
  if(!S.kid){tabs.hidden=true;app.innerHTML=`<p class="muted" style="margin-top:30vh;text-align:center"><span class="spin"></span></p>`;return;}
  tabs.hidden=false;tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
  const v={heute:vHeute,aufgaben:vAufgaben,entwicklung:vEntwicklung}[S.tab]||vHeute;
  app.innerHTML=header()+(S.err?`<p class="err" style="margin:6px 0">${esc(S.err)}</p>`:"")+v()+`<p class="tiny muted" style="text-align:center;margin-top:28px">Angemeldet als ${esc((FS.member()||{}).display_name||"")} · <button data-act="out" style="background:none;border:0;padding:0;text-decoration:underline;color:inherit;font-size:inherit;cursor:pointer">Abmelden</button></p>`;
}
function vLogin(){
  return `<div class="login stack"><div><div class="kicker">Familienspeicher</div><h1>Eltern-Cockpit</h1></div>
    <p class="muted small">Lernstände, Aufgaben und Entwicklung aus Lern-Match, Spürnase und dem Testtrainer. Nur für Eltern.</p>
    <form id="login" class="stack"><input class="inp" id="mail" type="email" autocomplete="username" placeholder="E-Mail" value="${esc(S.mail||"")}" required>
    <input class="inp" id="pw" type="password" autocomplete="current-password" placeholder="Passwort" required>
    <button class="btn" type="submit" ${S.busy?"disabled":""}>${S.busy?"Melde an …":"Anmelden"}</button></form>
    ${S.loginErr?`<p class="err">${esc(S.loginErr)}</p>`:""}
    <p class="tiny muted">Wer in einer der Apps schon angemeldet ist, ist es hier automatisch auch.</p></div>`;
}
async function boot(){
  S.err=null;
  if(!FS.session()){render();return;}
  render();
  try{
    const m=FS.member()||await FS.loadMember();
    if(!m){S.err="Dieses Konto gehört noch zu keiner Familie.";render();return;}
    if(m.role!=="parent"){S.err="Das Cockpit ist für Eltern gedacht. Mit diesem Konto ("+m.display_name+") geht es nicht.";render();return;}
    if(!C.lm)await loadContent();
    const all=await FS.familyMembers();S.kids=(all||[]).filter(x=>x.role==="child");
    if(!S.kids.length){S.err="In der Familie ist noch kein Kind angelegt.";render();return;}
    const keep=S.kid&&S.kids.find(k=>k.id===S.kid.id);S.kid=keep||S.kids[0];
    await loadKid();
  }catch(e){S.err=navigator.onLine===false||e instanceof TypeError?"Gerade kein Internet.":"Laden fehlgeschlagen: "+e.message;}
  render();
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("button,[data-tab],summary");if(!b)return;
  if(b.matches("summary")){const d=b.parentElement;if(d.dataset.k)setTimeout(()=>{S.open[d.dataset.k]=d.open;},0);return;}
  const tab=b.dataset.tab,sub=b.dataset.sub,go=b.dataset.go;
  if(tab){S.tab=tab;try{localStorage.setItem("cockpit-tab",tab);}catch(x){}render();scrollTo(0,0);return;}
  if(sub||go){S.sub=sub||go;S.tab="aufgaben";try{localStorage.setItem("cockpit-sub",S.sub);localStorage.setItem("cockpit-tab","aufgaben");}catch(x){}render();if(go)scrollTo(0,0);return;}
  if(b.dataset.range!=null){S.range=+b.dataset.range;render();return;}
  if(b.dataset.toggle){S.open[b.dataset.toggle]=!S.open[b.dataset.toggle];render();return;}
  if(b.dataset.kid){S.kid=S.kids.find(k=>k.id===b.dataset.kid);S.P={};S.log=[];S.daily=[];render();boot();return;}
  if(b.dataset.act==="reload"){boot();return;}
  if(b.dataset.act==="out"){await FS.signOut();S.kid=null;S.kids=[];S.P={};S.err=null;render();}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="login")return;e.preventDefault();
  S.mail=$("#mail").value;const pw=$("#pw").value;S.busy=true;S.loginErr=null;render();
  FS.signIn(S.mail,pw).then(()=>{S.busy=false;boot();}).catch(err=>{S.busy=false;S.loginErr=err.message;render();});
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.loaded&&Date.now()-S.loaded>5*60e3)boot();});
boot();
})();
</script>
</body>
</html>
